<!--TRANG 1: MỤC ĐÍCH & ĐỐI TƯỢNG TRUYỀN THÔNG -->
<section id="section-media-plan-intro">
  <div
    class="page page--media-plan"
    data-toc="Kế hoạch truyền thông - Mục đích"
  >
    <div class="page__inner">
      <div class="media-plan__header" data-animate="fadeInDown">
        <div class="media-plan__icon">
          <i class="bi" data-media-plan-icon></i>
        </div>
        <div class="media-plan__title">
          <span class="media-plan__sub-title" data-media-plan-sub-title></span>
          <h2 class="media-plan__main-title" data-media-plan-main-title></h2>
        </div>
      </div>

      <div class="media-plan__content">
        <div class="card media-plan__card" data-animate="fadeInLeft">
          <h3 class="media-plan__card-title" data-media-plan-purpose-title></h3>
          <ul class="media-plan__list" data-media-plan-purpose-list></ul>
        </div>

        <div class="card media-plan__card" data-animate="fadeInRight">
          <h3 class="media-plan__card-title" data-media-plan-audience-title></h3>
          <p class="media-plan__text" data-media-plan-audience-text></p>
        </div>
      </div>
    </div>
  </div>
</section>

<!--TRANG 2: MỤC TIÊU & TIMELINE TRUYỀN THÔNG-->
<section id="section-media-plan-timeline">
  <div
    class="page page--media-plan"
    data-toc="Kế hoạch truyền thông - Timeline"
  >
    <div class="page__inner">
      <div class="media-plan__header" data-animate="fadeInDown">
        <div class="media-plan__icon">
          <i class="bi" data-media-plan-icon></i>
        </div>
        <div class="media-plan__title">
          <span class="media-plan__sub-title" data-media-plan-sub-title></span>
          <h2 class="media-plan__main-title" data-media-plan-main-title></h2>
        </div>
      </div>

      <div class="page-layout">
        <div class="info-card" data-animate="fadeInLeft">
          <h3 class="info-card__title" data-media-plan-goal-title></h3>
          <p class="info-card__content" data-media-plan-goal-text></p>
        </div>

        <div class="timeline" data-animate="fadeInRight">
          <div class="timeline__track">
            <div class="timeline__line"></div>
            <div class="timeline__items" data-media-plan-timeline></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!--TRANG 3: ĐỐI TƯỢNG & MỤC TIÊU DỰ KIẾN-->
<section id="section-media-plan-targets">
  <div
    class="page page--media-plan"
    data-toc="Kế hoạch truyền thông - Chỉ tiêu"
  >
    <div class="page__inner">
      <div class="media-plan__header" data-animate="fadeInDown">
        <div class="media-plan__icon">
          <i class="bi" data-media-plan-icon></i>
        </div>
        <div class="media-plan__title">
          <span class="media-plan__sub-title" data-media-plan-sub-title></span>
          <h2 class="media-plan__main-title" data-media-plan-main-title></h2>
        </div>
      </div>

      <div class="targets-layout">
        <div class="target-card target-card--main" data-animate="fadeInDown">
          <h3 class="target-card__title" data-media-plan-target-main-title></h3>
          <div class="target-card__main-stat">
            <span class="target-card__main-number" data-media-plan-target-main-number></span>
            <span class="target-card__main-label" data-media-plan-target-main-label></span>
          </div>
        </div>

        <h3 class="targets-layout__heading" data-animate="fadeIn" data-media-plan-targets-heading></h3>

        <div class="targets-grid" data-media-plan-targets-grid></div>
      </div>
    </div>
  </div>
</section>
