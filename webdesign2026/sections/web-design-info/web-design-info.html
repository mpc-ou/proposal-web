<section id="section-web-design-info">
    <div class="page page--web-design-info" data-toc="Thông tin cuộc thi">
        <div class="web-design-info__container">

            <!-- Header -->
            <div class="web-design-info__header" data-animate="fadeInDown">
                <span class="web-design-info__subtitle" data-wdi-subtitle></span>
                <h1 class="web-design-info__title" data-wdi-title></h1>
            </div>

            <!-- Khung nội dung -->
            <div class="web-design-info__content">
                <!-- Cột trái: Văn bản mô tả -->
                <div class="web-design-info__left" data-animate="fadeInLeft">
                    <div class="web-design-info__description" data-wdi-description></div>
                </div>

                <div class="web-design-info__right" data-animate="fadeInRight">
                    <div class="web-design-info__image-wrapper">
                        <img data-wdi-image alt="" src="" class="web-design-info__img" data-lightbox="[]" />
                    </div>

                    <div class="web-design-info__card">
                        <h2 class="web-design-info__card-title" data-wdi-card-title></h2>
                        <ul class="web-design-info__list" data-wdi-info-list></ul>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>


<section id="section-evaluation-criteria">
    <div class="page page--evaluation-criteria" data-toc="Thông tin cuộc thi - Tiêu chí đánh giá">
        <div class="evaluation-criteria__container">

            <!-- Cột trái: Tiêu đề + Tiêu chí đánh giá -->
            <div class="evaluation-criteria__left">
                <div class="evaluation-criteria__header" data-animate="fadeInDown">
                    <span class="evaluation-criteria__subtitle" data-wdi-subtitle></span>
                    <h1 class="evaluation-criteria__title" data-wdi-title></h1>
                </div>

                <div class="evaluation-criteria__body" data-animate="fadeInUp">
                    <h2 class="evaluation-criteria__section-title" data-wdi-criteria-section-title></h2>
                    <p class="evaluation-criteria__intro" data-wdi-criteria-intro></p>

                    <ul class="evaluation-criteria__list" data-wdi-criteria-list></ul>

                    <p class="evaluation-criteria__footer-note" data-wdi-criteria-footer></p>
                </div>
            </div>

            <!-- Cột phải: Khối Chủ đề + Hình thức tham gia -->
            <div class="evaluation-criteria__right" data-animate="fadeInRight">
                <div class="evaluation-criteria__sidebar-card">

                    <div class="evaluation-criteria__block">
                        <h2 class="evaluation-criteria__block-title" data-wdi-theme-title></h2>
                        <div class="evaluation-criteria__block-text" data-wdi-theme-text></div>
                    </div>

                    <div class="evaluation-criteria__block">
                        <h2 class="evaluation-criteria__block-title" data-wdi-participation-title></h2>
                        <ul class="evaluation-criteria__info-list" data-wdi-participation-list></ul>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>


<section id="section-final-rules">
    <div class="page page--final-rules" data-toc="Thông tin cuộc thi - Yêu cầu thực hiện">
        <div class="final-rules__container">

            <!-- Header tiêu đề cuộc thi -->
            <div class="final-rules__header" data-animate="fadeInDown">
                <span class="final-rules__subtitle" data-wdi-subtitle></span>
                <h1 class="final-rules__title" data-wdi-title></h1>
            </div>

            <!-- Khối nội dung quy định chung kết -->
            <div class="final-rules__body" data-animate="fadeInUp">

                <div class="final-rules__section-header">
                    <div class="final-rules__accent-bar"></div>
                    <h2 class="final-rules__section-title" data-wdi-rules-section-title></h2>
                </div>

                <!-- Danh sách quy định -->
                <ul class="final-rules__list" data-wdi-rules-list></ul>

            </div>

        </div>
    </div>
</section>
