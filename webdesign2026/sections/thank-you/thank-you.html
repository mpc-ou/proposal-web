<section id="section-thank-you">
  <div class="page page--thank-you">
    <header class="thank-you__header" data-animate="fadeInDown">
      <h2 class="thank-you__title" data-thank-you-title></h2>
      <div class="thank-you__text" data-thank-you-text></div>
    </header>

    <div class="thank-you__grid">
      <div
        class="thank-you__column thank-you__column--contacts"
        data-animate="fadeInLeft"
        data-thank-you-contacts
      ></div>

      <div
        class="thank-you__column thank-you__column--info"
        data-animate="fadeInRight"
      >
        <div class="thank-you__info-box">
          <h3 class="thank-you__info-title" data-thank-you-info-title></h3>
          <ul class="thank-you__info-list" data-thank-you-info-list></ul>
        </div>
      </div>
    </div>
  </div>
</section>
