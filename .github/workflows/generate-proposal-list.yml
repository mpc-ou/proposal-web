name: Generate Proposal List

on:
  push:
    branches: [main, master]
    paths:
      - "proposals/*/data/info.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate proposal-list.json
        run: |
          set -euo pipefail

          entries=()
          for dir in proposals/*/; do
            info_file="${dir}data/info.json"
            [ -f "$info_file" ] || continue

            id=$(basename "$dir")
            title=$(jq -r '.site.title // empty' "$info_file")
            org=$(jq -r '.site.organization // empty' "$info_file")
            modified=$(git log -1 --format="%aI" -- "$dir" 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)

            entry=$(jq -n \
              --arg id "$id" \
              --arg name "$title" \
              --arg org "$org" \
              --arg path "$dir" \
              --arg modified "$modified" \
              '{id: $id, name: $name, organization: $org, path: $path, lastModified: $modified}')
            entries+=("$entry")
          done

          printf '%s\n' "${entries[@]}" | jq -s \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generated: $generated, proposals: .}' > proposal-list.json

      - name: Commit proposal-list.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proposal-list.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate proposal-list.json"
            git push
          fi
